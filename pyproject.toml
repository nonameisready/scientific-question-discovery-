[project]
name = "scientific-question-discovery"
version = "0.1.0"
description = "Automated scientific question discovery toward AGI — exoplanet atmospheres corpus v1"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "duckdb>=0.10",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
vector = [
    # v1 vector index: PostgreSQL + pgvector
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = { find = { include = ["src*"] } }
